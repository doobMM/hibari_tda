<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>살아 있는 고리</title>
<!--
  살아 있는 고리 — Lenia 생명체의 구멍이 hibari 지도의 고리를 켠다 (2026-10-01)
  사용자: "맨 처음에 automata랑 같이 그려주었던 lenia처럼 음악을 만들 수 있으면 좋겠어. 그걸 게임과 결합하고 싶거든" ·
          "1번(hibari 자신의 지도)으로 하고 깊이로 세기 정하는 거 섞어서" · "hibari에서 아이디어를 착안할 뿐, 조금 더 많은 음악이 …
          고리가 유동적으로 바뀌거나 이용자가 변경시킬 수 있었으면".
  생명체  Lenia 오비움(Chan 2019, 0.7배)이 토러스 판 위를 기어간다. 엔진·판정기: lifeloop-core.js · tools/verify_lifeloop.mjs
  구멍    생명체 몸의 구멍(H₁, 높은 값 집합의 지속 호몰로지)을 매 스텝 찾는다. 깊이 = 지속 = 소리 세기.
  지도    hibari 음 17개(같은 음높이 라벨은 평균 자리)를 정본 PH 고리 골격 배치(lenia/hibari.json)에 놓는다.
  고리    처음 = 정본 고리 14개(음 단위로 합쳐도 14개). 음에서 음으로 그으면 새 고리, 고리 선을 누르면 지운다.
  소리    구멍을 감싼 고리 하나가 켜지고 그 고리를 hibari 박(8분음표)에 연주한다 — 짝수 박 = 고리의 음 넷까지 화음, 홀수 박 = 고리를 따라 한 음씩.
          내가 그은 고리가 먼저, 없으면 hibari 고리 가운데 가장 안쪽. 고리 밖이면 가장 가까운 음 하나(작게). 왜 이 규칙인지는 lifeloop-core.js 머리말.
  조작    빈 곳에서 끌면 그 방향으로 생명체 · 음에서 시작해 음들을 지나 그으면 고리 · 고리 선 누르기 = 지우기 · 음 누르기 = 그 음 · ⌫ 되돌리기
  소리는 누른 뒤에만. ?silent 무음(호출만 기록). 그린 고리는 이 브라우저에 남는다.
  ⚠ 지도 평면 거리로 다시 잰 VR 고리는 2개뿐(지속 0.002·0.022, ripser 와 같음) — 정본 고리는 지도 거리가 아니라 정본 거리에서 나왔다. 그래서 고리는 계산하지 않고 그린다.
-->
<style>
 :root{--bg:#f3f0e6;--paper:#fbf9f2;--ink:#22302a;--dim:#7d877f;--line:#d6d2c2;--green:#2f6b4f}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
 main{max-width:1000px;margin:0 auto;padding:10px 16px 24px}
 header{display:flex;align-items:baseline;gap:10px;padding:4px 2px 6px}
 header h1{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.08em;margin:0}
 header a{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:none}
 #stage{position:relative;width:100%;height:min(80vh,720px);min-height:440px;border-radius:16px;overflow:hidden;background:#F7F4EC}
 #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
 #bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px}
 button{font:inherit;color:inherit;min-height:44px;padding:0 18px;white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:var(--paper);cursor:pointer}
 button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
 button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
 button[hidden]{display:none}
 #tag{position:absolute;left:14px;top:10px;font-size:12.5px;color:var(--dim);pointer-events:none;max-width:55%}
 #now{position:absolute;right:14px;top:8px;font-size:15px;pointer-events:none;text-align:right;line-height:1.45}
 #now small{display:block;font-size:12px;color:var(--dim)}
 #legend{font-size:12.5px;color:var(--dim);padding:8px 2px;line-height:1.6}
</style>
</head>
<body>
<main>
 <header><h1>살아 있는 고리</h1><a href="./index.html">스케치</a></header>
 <div id="stage">
  <canvas id="cv" role="img" aria-label="Lenia 생명체가 hibari 음 지도 위를 기어간다. 생명체 몸의 구멍이 고리 안에 들어가면 그 고리의 음이 울린다. 빈 곳에서 끌면 생명체를 보내고, 음에서 음으로 그으면 고리를 만든다."></canvas>
  <div id="tag">예시</div>
  <div id="now"></div>
  <div id="bar"><button id="listen" class="main">▶ 예시 듣기</button><button id="play">직접 하기</button><button id="undo" hidden>되돌리기</button><button id="reset" hidden>hibari 고리로</button></div>
 </div>
 <div id="legend"><b>빈 곳을 누르거나 끌면</b> 그 방향으로 생명체를 보내요 · <b>음에서 음으로 그으면</b> 내 고리(금색)가 생겨요 — 내 고리가 먼저 울려요 · 고리 선을 누르면 지워져요 · 생명체 몸의 구멍(분홍 원)이 고리 안에 들어가면 그 고리가 켜져 연주돼요(화음 ↔ 한 음씩 돌기) — 구멍이 깊을수록 크게 · ⌫ 되돌리기</div>
</main>
<script src="./common.js"></script>
<script src="./lifeloop-core.js?v=3"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var cv = $('#cv'), cx = cv.getContext('2d'), SEC = HS.SEC, TAU = Math.PI * 2, KEY = 'hibari.lifeloop.v1', N = 64;
  var W = LifeLoop.World(N), TR = LifeLoop.Tracker(N), towns = [], loops = [], mine = [], ORIGL = [], undo = [];   // loops = hibari 고리(지울 수 있다) · mine = 내가 그은 고리(먼저 운다)
  var auto = true, sound = false, clock = null, fr = 0, dead = 0, ptr = null, demoT = 0, demoN = 0, ghost = null, last = 0;
  var litT = {}, onT = {}, holesNow = [], L = null, nowNotes = [];
  function start() { W.clear(); W.stamp(16, 18, 0); W.stamp(44, 44, 0); }

  // ── 박마다: 가장 깊은 구멍이 화음(짝수)·단음(홀수), 둘째 구멍은 홀수 박에 단음 ────────────────────────────
  function onStep(t, when) {
    var hs = TR.list().filter(function (h) { return h.a > 0.5; }).sort(function (a, b) { return b.d - a.d; }), out = [];
    hs.slice(0, 2).forEach(function (h, n) {                     // 깊은 구멍 둘까지 — 각자 자기를 감싼 고리를 연주한다
      var w = LifeLoop.which(h.x, h.y, towns, loops, mine), v = LifeLoop.vel(h.d) * (n ? 0.75 : 1), ks = w.on ? LifeLoop.play(w.loop, t + n) : (t % 2 ? w.loop : []);
      if (w.on) onT[w.on] = when;
      ks.forEach(function (k, i) { out.push([k, ks.length > 1 ? v * 0.62 : w.on ? v : v * 0.6, ks.length > 1 ? 2 : 1, i + n * 4]); }); });
    out.forEach(function (o) { if (sound) HS.audio.voice(towns[o[0]].p, when + o[3] * 0.012, o[2] * SEC * 1.05, o[1]); litT[o[0]] = when; });
    if (out.length) nowNotes = [when, out.map(function (o) { return towns[o[0]].name; })];
  }
  function tick(steps) {                                   // 생명체 n 스텝 + 구멍 찾기
    for (var i = 0; i < steps; i++) { W.step(); if (W.mass < 3) { if (++dead > 40) { start(); dead = 0; } } else dead = 0; }
    holesNow = TR.update(LifeLoop.holes(W.A, N, 0.12, 3).slice(0, 6));
  }

  // ── 지도 좌표 ↔ 화면 ────────────────────────────────────────────────────────────────────────
  function layout() { var w = cv.clientWidth, h = cv.clientHeight, side = Math.min(w - 16, h - 110), x0 = (w - side) / 2, y0 = Math.max(44, (h - 60 - side) / 2);
    return { w: w, h: h, x0: x0, y0: y0, sc: side / N }; }
  function toS(x, y) { return [L.x0 + x * L.sc, L.y0 + y * L.sc]; }
  function toW(px, py) { return [(px - L.x0) / L.sc, (py - L.y0) / L.sc]; }
  function nearTown(px, py, r) { var best = -1, bd = r; towns.forEach(function (t, k) { var s = toS(t.x, t.y), d = Math.hypot(s[0] - px, s[1] - py); if (d < bd) { bd = d; best = k; } }); return best; }
  function segD(px, py, a, b) { var dx = b[0] - a[0], dy = b[1] - a[1], u = Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(a[0] + u * dx - px, a[1] + u * dy - py); }
  function nearLoop(px, py, r) { var best = null, bd = r; [['m', mine], ['h', loops]].forEach(function (set) { set[1].forEach(function (l, i) { for (var j = 0; j < l.length; j++) {
    var a = toS(towns[l[j]].x, towns[l[j]].y), b = toS(towns[l[(j + 1) % l.length]].x, towns[l[(j + 1) % l.length]].y), d = segD(px, py, a, b); if (d < bd) { bd = d; best = [set[0], i]; } } }); }); return best; }

  // ── 조작 ─────────────────────────────────────────────────────────────────────────────────
  function unlock() { HS.audio.wake(); sound = true; $('#listen').textContent = '듣는 중…'; $('#listen').disabled = true; if (!auto) $('#listen').hidden = true; }
  function takeOver() { if (!auto) return; auto = false; ghost = null; loops = ORIGL.map(function (l) { return l.slice(); }); mine = []; undo = []; $('#tag').textContent = ''; $('#listen').hidden = $('#play').hidden = true; $('#undo').hidden = $('#reset').hidden = false; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loops: loops, mine: mine })); } catch (x) {} }
  function edit(f) { undo.push([loops.map(function (l) { return l.slice(); }), mine.map(function (l) { return l.slice(); })]); if (undo.length > 40) undo.shift(); f(); if (!auto) save(); }
  function ping(k, v) { if (sound && k >= 0) HS.audio.voice(towns[k].p, null, 0.5, v || 0.18); litT[k] = HS.audio.now(); }   // 누른 그 호출 안에서
  function launch(wx, wy, dx, dy) { var rot = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3); W.stamp(Math.round(wx), Math.round(wy), rot);
    var best = 0, bd = 1e9; towns.forEach(function (t, k) { var d = Math.hypot(t.x - wx, t.y - wy); if (d < bd) { bd = d; best = k; } }); ping(best, 0.12); }
  function addLoop(path) { if (path.length >= 3) edit(function () { mine.push(path.slice()); }); }
  function removeLoop(at) { if (!at) return; edit(function () { (at[0] === 'm' ? mine : loops).splice(at[1], 1); }); onT = {}; if (sound) HS.audio.voice(45, null, 0.6, 0.08); }
  function xy(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); unlock(); takeOver(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    var p = xy(e), hit = e.pointerType === 'touch' ? 22 : 14, k = nearTown(p[0], p[1], hit);
    if (k >= 0) { ptr = { id: e.pointerId, mode: 'loop', path: [k], at: p, s: p }; ping(k); return; }
    var li = nearLoop(p[0], p[1], e.pointerType === 'touch' ? 12 : 7);
    ptr = { id: e.pointerId, mode: li ? 'edge' : 'launch', loop: li, at: p, s: p };
  });
  cv.addEventListener('pointermove', function (e) { if (!ptr || ptr.id !== e.pointerId) return; var p = xy(e); ptr.at = p;
    if (ptr.mode === 'edge' && Math.hypot(p[0] - ptr.s[0], p[1] - ptr.s[1]) > 10) ptr.mode = 'launch';
    if (ptr.mode !== 'loop') return; var k = nearTown(p[0], p[1], e.pointerType === 'touch' ? 22 : 14);
    if (k >= 0 && ptr.path.indexOf(k) < 0) { ptr.path.push(k); ping(k); } });
  function up(e) { if (!ptr || (e && ptr.id !== e.pointerId)) return; var p = ptr, moved = Math.hypot(p.at[0] - p.s[0], p.at[1] - p.s[1]); ptr = null;
    if (p.mode === 'loop') addLoop(p.path);
    else if (p.mode === 'edge' && moved <= 10) removeLoop(p.loop);
    else if (p.mode === 'launch') { var w0 = toW(p.s[0], p.s[1]); launch(w0[0], w0[1], moved > 10 ? p.at[0] - p.s[0] : 1, moved > 10 ? p.at[1] - p.s[1] : 0); } }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  var DIRS = { ArrowRight: [1, 0], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowUp: [0, -1] };
  HS.keys(function (code) { if (DIRS[code]) { unlock(); takeOver(); launch(8 + Math.random() * 48, 8 + Math.random() * 48, DIRS[code][0], DIRS[code][1]); }
    else if (code === 'Backspace') doUndo(); });
  function doUndo() { if (!undo.length) return; var u = undo.pop(); loops = u[0]; mine = u[1]; onT = {}; save(); }
  $('#listen').addEventListener('click', unlock);
  $('#play').addEventListener('click', function () { unlock(); takeOver(); });
  $('#undo').addEventListener('click', doUndo);
  $('#reset').addEventListener('click', function () { edit(function () { loops = ORIGL.map(function (l) { return l.slice(); }); mine = []; }); onT = {}; });

  // ── 예시: 6초에 생명체를 보내고, 12초에 고리를 하나 긋고, 34초에 그 고리를 지운다(40초마다 되풀이) ──────────
  function demo(dt) {
    demoT += dt; var t = demoT % 40;
    if (t < dt) { start(); loops = ORIGL.map(function (l) { return l.slice(); }); mine = []; }
    if (t >= 6 && t < 7.2) { var f = (t - 6) / 1.2; ghost = { kind: 'launch', a: [10, 50], b: [10 + 14 * f, 50] }; $('#tag').textContent = '예시 — 빈 곳에서 끌어 생명체 보내기'; }
    else if (ghost && ghost.kind === 'launch') { launch(10, 50, 1, 0); ghost = null; }
    var path = demoPath(); if (t < dt) demoN = 0;
    if (path.length && t >= 12 && t < 15) { var n = Math.min(path.length, 1 + Math.floor((t - 12) / 0.7)); ghost = { kind: 'loop', path: path.slice(0, n) }; $('#tag').textContent = '예시 — 음에서 음으로 그어 고리 만들기';
      if (n > demoN) { demoN = n; ping(path[n - 1]); } }
    else if (ghost && ghost.kind === 'loop') { addLoop(ghost.path); ghost = null; $('#tag').textContent = '예시 — 새 고리 안으로 구멍이 지나가면 그 음들이 울려요'; }
    if (t >= 34 && t < 34 + dt && mine.length) removeLoop(['m', mine.length - 1]);
  }
  var DP = null;
  function demoPath() { if (DP) return DP; var c = [32, 32], ks = towns.map(function (t, k) { return [Math.hypot(t.x - c[0], t.y - c[1]), k]; }).sort(function (a, b) { return a[0] - b[0]; }).slice(0, 4).map(function (z) { return z[1]; });
    ks.sort(function (a, b) { return Math.atan2(towns[a].y - c[1], towns[a].x - c[0]) - Math.atan2(towns[b].y - c[1], towns[b].x - c[0]); }); return (DP = ks); }

  // ── 그리기 ───────────────────────────────────────────────────────────────────────────────
  var off = document.createElement('canvas'); off.width = off.height = N; var ox = off.getContext('2d'), img = ox.createImageData(N, N);
  var P = [[247, 243, 233], [205, 228, 196], [120, 180, 150], [47, 107, 86]];
  function col(v) { v = Math.min(1, v * 1.1); var i = Math.min(2, Math.floor(v * 3)), f = v * 3 - i; return [0, 1, 2].map(function (k) { return P[i][k] + (P[i + 1][k] - P[i][k]) * f; }); }
  function draw(now) {
    var A = W.A, i;
    for (i = 0; i < N * N; i++) { var c = col(A[i]); img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255; }
    ox.putImageData(img, 0, 0); cx.clearRect(0, 0, L.w, L.h); cx.imageSmoothingEnabled = true;
    cx.save(); cx.beginPath(); cx.rect(L.x0, L.y0, N * L.sc, N * L.sc); cx.clip(); cx.drawImage(off, L.x0, L.y0, N * L.sc, N * L.sc);
    // 고리 — 켜진 것만 분홍으로
    [['h', loops, 'rgba(47,107,79,0.2)', 1.3], ['m', mine, 'rgba(201,138,18,0.55)', 2]].forEach(function (set) { set[1].forEach(function (l, li) {
      var key = set[0] + li, on = onT[key] != null && now - onT[key] < 0.9 && now >= onT[key]; cx.beginPath();
      l.forEach(function (k, j) { var s = toS(towns[k].x, towns[k].y); if (j) cx.lineTo(s[0], s[1]); else cx.moveTo(s[0], s[1]); }); cx.closePath();
      if (on) { cx.fillStyle = 'rgba(210,85,111,0.07)'; cx.fill(); }
      cx.strokeStyle = on ? 'rgba(210,85,111,0.8)' : set[2]; cx.lineWidth = on ? 2.6 : set[3]; cx.stroke(); }); });   // 초록 = hibari 고리 · 금색 = 내가 그은 고리 · 분홍 = 지금 켜진 고리
    // 그리는 중인 고리 · 보내는 화살표
    var gp = ptr && ptr.mode === 'loop' ? { path: ptr.path, at: ptr.at } : ghost && ghost.kind === 'loop' ? { path: ghost.path } : null;
    if (gp) { cx.setLineDash([5, 5]); cx.strokeStyle = 'rgba(34,48,42,0.7)'; cx.lineWidth = 2; cx.beginPath();
      gp.path.forEach(function (k, j) { var s = toS(towns[k].x, towns[k].y); if (j) cx.lineTo(s[0], s[1]); else cx.moveTo(s[0], s[1]); }); if (gp.at) cx.lineTo(gp.at[0], gp.at[1]); cx.stroke(); cx.setLineDash([]); }
    var ar = ptr && ptr.mode === 'launch' ? [ptr.s, ptr.at] : ghost && ghost.kind === 'launch' ? [toS(ghost.a[0], ghost.a[1]), toS(ghost.b[0], ghost.b[1])] : null;
    if (ar && Math.hypot(ar[1][0] - ar[0][0], ar[1][1] - ar[0][1]) > 6) { var an = Math.atan2(ar[1][1] - ar[0][1], ar[1][0] - ar[0][0]); cx.strokeStyle = 'rgba(34,48,42,0.6)'; cx.lineWidth = 2.5; cx.beginPath();
      cx.moveTo(ar[0][0], ar[0][1]); cx.lineTo(ar[1][0], ar[1][1]); cx.lineTo(ar[1][0] - 10 * Math.cos(an - 0.5), ar[1][1] - 10 * Math.sin(an - 0.5)); cx.moveTo(ar[1][0], ar[1][1]);
      cx.lineTo(ar[1][0] - 10 * Math.cos(an + 0.5), ar[1][1] - 10 * Math.sin(an + 0.5)); cx.stroke(); }
    // 구멍 — 생명체 몸의 H₁
    holesNow.forEach(function (t) { var r = Math.max(2.5, Math.sqrt(t.s / Math.PI) + 1.5) * L.sc, s = toS(t.x + 0.5, t.y + 0.5), pd = Math.min(1, t.d / 0.35);
      cx.globalAlpha = t.a; cx.strokeStyle = '#d2556f'; cx.lineWidth = 1.5 + 2 * pd; cx.beginPath(); cx.arc(s[0], s[1], r, 0, TAU); cx.stroke(); cx.globalAlpha = 1; });
    cx.restore();
    // 음(마을)
    cx.textAlign = 'center'; cx.font = '11px -apple-system,"Noto Sans KR",sans-serif';
    towns.forEach(function (t, k) { var s = toS(t.x, t.y), g = litT[k] != null && now >= litT[k] ? Math.max(0, 1 - (now - litT[k]) / 0.6) : 0;
      if (g) { cx.beginPath(); cx.arc(s[0], s[1], 7 + 9 * (1 - g), 0, TAU); cx.strokeStyle = 'rgba(201,138,18,' + g + ')'; cx.lineWidth = 2; cx.stroke(); }
      cx.beginPath(); cx.arc(s[0], s[1], 3.6 + 2.5 * g, 0, TAU); cx.fillStyle = g ? '#c98a12' : 'rgba(34,48,42,0.7)'; cx.fill();
      cx.fillStyle = 'rgba(34,48,42,0.85)'; cx.fillText(t.name, s[0], s[1] - 8); });
    if (nowNotes[0] != null && now >= nowNotes[0]) { var nOn = Object.keys(onT).filter(function (k) { return now - onT[k] < 0.9 && now >= onT[k]; }).length;
      $('#now').innerHTML = nowNotes[1].join(' ') + '<small>켜진 고리 ' + nOn + ' · 생명체 ' + Math.max(0, Math.round(W.mass / 34)) + '</small>'; }
  }
  function frame(t) {
    try { var dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
      var dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight; if (!w || !h || !towns.length) return;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); L = layout(); fr++;
      if (auto) demo(dt); if (fr % 3 === 0) tick(1);
      draw(HS.audio.now());
    } finally { requestAnimationFrame(frame); }
  }

  // ── 자료: 정본 PH 고리 골격 배치 → 음 17개, 정본 고리 14개(음 단위) ─────────────────────────────
  fetch('../lenia/hibari.json').then(function (r) { return r.json(); }).then(function (D) {
    var by = {}, P2 = D.labels.map(function (l) { return l.pitch; });
    D.labels.forEach(function (l, i) { (by[l.pitch] = by[l.pitch] || []).push(D.layout.coords[i]); });
    var ps = Object.keys(by).map(Number).sort(function (a, b) { return a - b; }), at = {};
    ps.forEach(function (p, k) { var c = by[p], mx = c.reduce(function (s, q) { return s + q[0]; }, 0) / c.length, my = c.reduce(function (s, q) { return s + q[1]; }, 0) / c.length;
      towns.push({ x: 6 + 52 * mx, y: 6 + 52 * my / 1.07, p: p, name: HS.noteName(p) }); at[p] = k; });
    ORIGL = D.traversal.map(function (tr) { var o = []; tr.forEach(function (i) { var k = at[P2[i]]; if (o[o.length - 1] !== k) o.push(k); }); if (o.length > 1 && o[0] === o[o.length - 1]) o.pop(); return o; });
    loops = ORIGL.map(function (l) { return l.slice(); });
    var okL = function (a) { return Array.isArray(a) && a.every(function (l) { return Array.isArray(l) && l.every(function (k) { return k >= 0 && k < towns.length; }); }); };
    try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv && okL(sv.loops) && okL(sv.mine)) {
      loops = sv.loops; mine = sv.mine; auto = false; $('#tag').textContent = '지난번 고리'; $('#listen').textContent = '▶ 듣기'; $('#play').hidden = true; $('#undo').hidden = $('#reset').hidden = false; } } catch (x) {}
    start(); clock = HS.clock(onStep); clock.start();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) clock.start(); });
    requestAnimationFrame(frame);
  }).catch(function (e) { $('#tag').textContent = '자료를 읽지 못했어요: ' + e.message; });

  HS.hook({
    probe: function () { return { auto: auto, sound: sound, mass: +W.mass.toFixed(1), holes: holesNow.length, loops: loops.length, mine: mine.length, calls: HS.audio.calls.length, towns: towns.length }; },
    take: function () { takeOver(); }, unlock: unlock, stop: function () { clock.stop(); }, start: function () { clock.start(); },
    tick: function (n) { tick(n); }, beat: function (n) { clock.advance(n); }, launch: function (x, y, dx, dy) { launch(x, y, dx, dy); },
    addLoop: addLoop, removeLoop: function () { removeLoop(['m', mine.length - 1]); }, undo: doUndo, loops: function () { return loops; }, mine: function () { return mine; }, towns: function () { return towns; },
    holes: function () { return holesNow; }, onT: function () { return onT; },
    advance: function (sec) { for (var i = 0; i < sec * 60; i++) { if (auto) demo(1 / 60); if (i % 3 === 0) tick(1); } L = layout(); draw(HS.audio.now()); },   // 가려진 창에선 그리기 루프가 멈춘다 — 검증이 시간을 감는다
    snap: function () { return Array.from(W.A); }, restore: function (arr) { W.set(arr); TR = LifeLoop.Tracker(N); holesNow = []; onT = {}; }   // 누른 판/안 누른 판 — 같은 판에서 두 갈래
  });
})();
</script>
